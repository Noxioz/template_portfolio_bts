- code: c3
  libelle: "Déployer et administrer des services Web"
  decription: "Comprendre l'hébergement Web, les serveurs et les services nécessaires pour rendre un site accessible."
- code: c4
  libelle: "Organiser et réaliser un projet informatique"
  decription: "Définir un objectif, planifier les étapes, réaliser le travail et vérifier le résultat."
- code: c5
  libelle: "Mettre à disposition un service informatique"
  decription: "Installer, configurer et rendre opérationnels des services informatiques pour les utilisateurs."
- code: c6
  libelle: "Organiser son développement professionnel"
  decription: "Se former, suivre les évolutions informatiques et développer ses compétences professionnelles."
